plugins { id 'com.android.application' }

android {
    namespace 'com.criatech.criaos.rotas'
    compileSdk 36
    defaultConfig {
        applicationId 'com.criatech.criaos.rotas'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    if (System.getenv('CRIAOS_KEYSTORE_FILE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('CRIAOS_KEYSTORE_FILE'))
                storePassword System.getenv('CRIAOS_STORE_PASSWORD')
                keyAlias System.getenv('CRIAOS_KEY_ALIAS')
                keyPassword System.getenv('CRIAOS_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
    testImplementation 'junit:junit:4.13.2'
}
