<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Escudo minimalista -->
  <path d="M100 15 L165 40 L165 95 C165 140 137 172 100 188 C63 172 35 140 35 95 L35 40 Z"
        fill="url(#shieldGrad)" />

  <!-- Circuito eletrônico sutil ao fundo -->
  <g stroke="#FFFFFF" stroke-width="1.4" opacity="0.18" fill="none">
    <path d="M50 60 H75 V80 H95"/>
    <circle cx="50" cy="60" r="2.5" fill="#FFFFFF"/>
    <circle cx="95" cy="80" r="2.5" fill="#FFFFFF"/>
    <path d="M150 65 H125 V90 H110"/>
    <circle cx="150" cy="65" r="2.5" fill="#FFFFFF"/>
    <circle cx="110" cy="90" r="2.5" fill="#FFFFFF"/>
    <path d="M60 140 H80 V120"/>
    <circle cx="60" cy="140" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Gráfico crescente -->
  <polyline points="62,125 82,105 98,118 130,80 150,60"
            fill="none" stroke="url(#chartGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="140,60 150,60 150,70" fill="#4ADE80"/>

  <circle cx="62" cy="125" r="4.5" fill="#FFFFFF"/>
  <circle cx="98" cy="118" r="4.5" fill="#FFFFFF"/>
  <circle cx="130" cy="80" r="4.5" fill="#FFFFFF"/>
</svg>
